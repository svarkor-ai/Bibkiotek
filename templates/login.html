{% extends "base.html" %}
{% block title %}Logga in — Bibliotek{% endblock %}

{% block content %}
<div style="max-width:380px;margin:3rem auto">
  <div class="card">
    <div style="text-align:center;margin-bottom:1.5rem">
      <span style="font-size:2.5rem">🔐</span>
      <h2 style="font-family:var(--font-serif);color:var(--clr-primary);margin-top:.5rem">Logga in</h2>
    </div>

    {% if error %}
    <div class="form-error" style="text-align:center">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label for="username">Användarnamn</label>
        <input type="text" id="username" name="username" required autofocus
               placeholder="ditt_anvandarnamn">
      </div>
      <div class="form-group">
        <label for="password">Lösenord</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Logga in</button>
    </form>

    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--clr-text-muted)">
      Har du inget konto? <a href="/register">Skapa ett →</a>
    </p>
  </div>

  <div style="margin-top:1.5rem;padding:1rem;background:var(--clr-surface);border-radius:var(--radius);box-shadow:var(--shadow-sm)">
    <p style="font-size:.85rem;color:var(--clr-text-muted)">
      <strong>Bästa testkonto:</strong> <code>admin</code> / <code>admin123</code>
    </p>
  </div>
</div>
{% endblock %}
